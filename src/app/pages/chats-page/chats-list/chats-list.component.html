<div class="chats-filter-input__wrapper">
  <label class="tt-form-label">
    <span class="tt-form-label__text">Имя</span>
    <input class="tt-form-input" type="text" />
  </label>
</div>

@for (chat of chats$ | async; track chat.id) {
  <button
    chats
    [chat]="chat"
    [routerLink]="[chat.id]"
    routerLinkActive="active"
  ></button>
}
